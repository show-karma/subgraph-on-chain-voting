enum ProposalStatus {
  Pending
  Active
  Canceled
  Defeated
  Succeeded
  Queued
  Expired
  Executed
}

type Organization @entity {
  id: ID!
}

type User @entity {
  id: ID!
  votes: [Vote!]! @derivedFrom(field: "user")
  organization: Organization
}

type Proposal @entity {
  id: ID!
  status: ProposalStatus!
  description: String!
  proposer: String!
  votes: [Vote!]! @derivedFrom(field: "proposal")
  organization: Organization!
  timestamp: BigInt!
  startDate: BigInt!
  endDate: BigInt
  endBlock: BigInt
}

# Internal bookkeeping: proposals that have not reached a terminal state yet,
# so mappings can resolve Defeated/Expired (states the Governor never emits
# events for) by calling state() once the voting period is over.
type OpenProposals @entity {
  id: ID! # daoName
  proposalIds: [BigInt!]!
}

type Vote @entity {
  id: ID!
  user: User!
  proposal: Proposal!
  support: Int
  solution: BigInt
  weight: BigInt
  reason: String
  organization: Organization!
  timestamp: BigInt!
}
