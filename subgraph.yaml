specVersion: 0.0.4
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum/contract
    name: ENSGovernor
    network: mainnet
    source:
      address: "0x323A76393544d5ecca80cd6ef2A560C6a395b7E3"
      abi: ENSGovernor
      startBlock: 13533750
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - Proposal
        - Vote
      abis:
        - name: ENSGovernor
          file: ./abis/ENSGovernor.json
      eventHandlers:
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
      file: ./src/ens_mapping.ts
  - kind: ethereum/contract
    name: RariGovernorBravo
    network: mainnet
    source:
      address: "0x91d9c2b5cF81D55a5f2Ecc0fC84E62f9cd2ceFd6"
      abi: RariGovernorBravo
      startBlock: 12904056
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - Proposal
        - Vote
      abis:
        - name: RariGovernorBravo
          file: ./abis/RariGovernorBravo.json
      eventHandlers:
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
      file: ./src/rari_mapping.ts
  - kind: ethereum
    name: RariFoundation
    network: mainnet
    source:
      address: "0x6552C8fb228f7776Fc0e4056AA217c139D4baDa1"
      abi: RariFoundation
      startBlock: 15719153
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - User
        - Proposal
        - Vote
      abis:
        - name: RariFoundation
          file: ./abis/RariFoundation.json
      eventHandlers:
        - event: ProposalCanceled(uint256)
          handler: handleProposalCanceled
        - event: ProposalCreated(uint256,address,address[],uint256[],string[],bytes[],uint256,uint256,string)
          handler: handleProposalCreated
        - event: ProposalExecuted(uint256)
          handler: handleProposalExecuted
        - event: ProposalQueued(uint256,uint256)
          handler: handleProposalQueued
        - event: VoteCast(indexed address,uint256,uint8,uint256,string)
          handler: handleVoteCast
        - event: VoteCastWithParams(indexed address,uint256,uint8,uint256,string,bytes)
          handler: handleVoteCast
      file: ./src/rari-foundation.ts
